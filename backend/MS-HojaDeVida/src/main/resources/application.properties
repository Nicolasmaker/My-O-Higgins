spring.application.name=hoja-de-vida

# Puerto local con fallback para no romper el arranque actual.
# Si necesitas mover el servicio, define HOJA_DE_VIDA_PORT antes de iniciar.
server.port=${HOJA_DE_VIDA_PORT:8084}

# Base de datos MySQL (RDS en AWS)
spring.datasource.url=jdbc:mysql://bd-my-ohiggins.cdabac7ubiin.us-east-1.rds.amazonaws.com:3306/HOJA_DE_VIDA?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:My_ohiggins2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA crea/recrea la estructura en este entorno (mismo patrón que el resto de los MS).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Conexiones HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Carga datos iniciales para que HojaDeVida y Anotaciones puedan probarse sin inserciones manuales.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Mensajes útiles para Postman y depuración básica.
spring.web.resources.add-mappings=false

# URL del Microservicio de Autenticación
# (En local apunta a localhost:8080, en AWS apuntará al host/IP correspondiente)
app.services.autenticacion-url=http://localhost:8080

# Límite de tamaño para la subida de documentos oficiales adjuntos (Hoja de Vida)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB