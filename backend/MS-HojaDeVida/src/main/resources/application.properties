spring.application.name=hoja-de-vida

# Puerto local para que el equipo pueda ejecutar el microservicio sin coordinación extra.
server.port=8084

# Base de datos H2 en archivo para que los datos de prueba sobrevivan entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/hojadevida-db;MODE=Oracle;DATABASE_TO_UPPER=true;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA crea o actualiza la estructura automáticamente en este entorno de desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 disponible para revisar datos si hace falta durante las pruebas.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mensajes útiles para Postman y depuración básica.
spring.web.resources.add-mappings=false