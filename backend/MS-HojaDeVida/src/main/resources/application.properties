spring.application.name=hoja-de-vida

# Puerto local con fallback para no romper el arranque actual.
# Si necesitas mover el servicio, define HOJA_DE_VIDA_PORT antes de iniciar.
server.port=${HOJA_DE_VIDA_PORT:8084}

# Base de datos H2 en archivo para que los datos de prueba sobrevivan entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/hojadevida-db;MODE=Oracle;DATABASE_TO_UPPER=true;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA crea o actualiza la estructura automáticamente en este entorno de desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Carga datos iniciales para que HojaDeVida y Anotaciones puedan probarse sin inserciones manuales.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola H2 disponible para revisar datos si hace falta durante las pruebas.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mensajes útiles para Postman y depuración básica.
spring.web.resources.add-mappings=false

# URL del Microservicio de Autenticación
# (En local apunta a localhost:8080, en AWS apuntará al host/IP correspondiente)
app.services.autenticacion-url=http://localhost:8080