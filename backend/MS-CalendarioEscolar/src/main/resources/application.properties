# Puerto en el que se ejecutará este microservicio
server.port=8085

# Nombre de la aplicación
spring.application.name=ms-calendarioescolar

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL - RDS AWS)
# ===============================
spring.datasource.url=jdbc:mysql://bd-my-ohiggins.cdabac7ubiin.us-east-1.rds.amazonaws.com:3306/CALENDARIO_ESCOLAR?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:My_ohiggins2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ===============================
# CONEXIONES HIKARICP
# ===============================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Permite cargar datos iniciales desde data.sql luego de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data.sql está en UTF-8; sin esto Spring lo lee con el charset de la plataforma
# (Windows-1252) y rompe tildes/ñ ("año" -> "aÃ±o").
spring.sql.init.encoding=UTF-8
