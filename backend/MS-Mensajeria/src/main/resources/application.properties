spring.application.name=msmensajeria
server.port=8089

#MANEJO DE ERRORES

#Incluye los errores de datos entrantes en las respuestas HTTP
spring.web.error.include-binding-errors=always

#Incluye el mensaje detallado del error en las respuestas HTTP
spring.web.error.include-message=always

#CONEXION A LA BASE DE DATOS

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/MENSAJERIA?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=msg_service_admin
spring.datasource.password=Msg_2026@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#CONFIGURACION JPA

#Crea las tablas de las entidades y las borra al apagar
#(CAMBIAR A update CUANDO EL MS ESTE LISTO)
spring.jpa.hibernate.ddl-auto=create-drop

#Muestra las consultas sql en los logs
spring.jpa.show-sql=true

#Para que los logs de las consultas se entiendan al leerlas
spring.jpa.properties.hibernate.format_sql=true

#Permite escribir en Java en lugar de SQL — Hibernate lo traduce a queries
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#CONEXIONES HIKARICP

#Tiempo maximo de espera para obtener una conexion del pool. 30000ms = 30 segundos.
spring.datasource.hikari.connection-timeout=30000

#Numero maximo de conexiones simultaneas en el pool
spring.datasource.hikari.maximum-pool-size=10
