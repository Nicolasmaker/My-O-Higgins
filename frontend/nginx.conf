# ================================================================
# Nginx — sirve el build de React y hace de reverse proxy a los MS.
# Replica los proxies/rewrites de vite.config.js (dev), apuntando a
# las IPs privadas de cada servidor EC2.
#
#   10.0.100.254  -> Autenticacion (8080) + GestionAcademica (8087)
#   10.0.200.61   -> Anotaciones (8083) + HojaDeVida (8084)
#   10.1.10.253   -> GestionReuniones (8081) + Mensajeria (8089)
#   10.1.10.150   -> CalendarioEscolar (8085) + GestionMatricula (8086)
# ================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de documentos de Hoja de Vida (hasta 5MB)
    client_max_body_size 10m;

    # Headers reenviados a todos los upstreams (Authorization pasa por defecto)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- SPA: las rutas de React Router caen a index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # API — reverse proxy a los microservicios
    # ============================================================

    # MS-Autenticacion (8080) — quita el prefijo /api/auth
    location /api/auth {
        rewrite ^/api/auth/?(.*)$ /$1 break;
        proxy_pass http://10.0.100.254:8080;
    }

    # MS-GestionReuniones (8081)
    location /api/reuniones {
        proxy_pass http://10.1.10.253:8081;
    }

    # MS-Anotaciones (8083)
    location /api/anotaciones {
        proxy_pass http://10.0.200.61:8083;
    }

    # MS-HojaDeVida (8084) — /api/hoja-vida -> /api
    location /api/hoja-vida {
        rewrite ^/api/hoja-vida/?(.*)$ /api/$1 break;
        proxy_pass http://10.0.200.61:8084;
    }

    # MS-CalendarioEscolar (8085)
    location /api/calendarios {
        proxy_pass http://10.1.10.150:8085;
    }

    # MS-CalendarioEscolar (8085) — Mural Digital
    location /api/murales {
        proxy_pass http://10.1.10.150:8085;
    }

    # MS-GestionMatricula (8086)
    location /api/matriculas {
        proxy_pass http://10.1.10.150:8086;
    }

    # MS-GestionAcademica (8087) — quita el prefijo /api/academico
    location /api/academico {
        rewrite ^/api/academico/?(.*)$ /$1 break;
        proxy_pass http://10.0.100.254:8087;
    }

    # MS-Mensajeria (8089)
    location /api/mensajeria {
        proxy_pass http://10.1.10.253:8089;
    }
}
