# ============================================================
# EC2 SV_CALENDARIO_MATRICULA (10.1.10.150, cuenta 2)
#   CalendarioEscolar (8085) + GestionMatricula (8086)
# Conviene levantarlo temprano: GestionMatricula siembra las
# matrículas que HojaDeVida referencia en su propio seeder.
#   docker compose -f docker-compose.calendario-matricula.yml up -d --build
# ============================================================
name: myohiggins-calendario-matricula

services:
  calendario:
    build:
      context: ../backend/MS-CalendarioEscolar
    container_name: ms-calendarioescolar
    restart: unless-stopped
    env_file:
      - deploy.env
    environment:
      - APP_SERVICES_GESTIONACADEMICA_URL=http://10.0.100.254:8087
    ports:
      - "8085:8085"

  matricula:
    build:
      context: ../backend/MS-GestionMatricula
    container_name: ms-gestionmatricula
    restart: unless-stopped
    env_file:
      - deploy.env
    environment:
      - APP_SERVICES_AUTENTICACION_URL=http://10.0.100.254:8080
      - APP_SERVICES_HOJADEVIDA_URL=http://10.0.200.61:8084
    ports:
      - "8086:8086"
